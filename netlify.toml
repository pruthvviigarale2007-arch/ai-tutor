# ==========================================
# Netlify Configuration for LearnMate AI
# ==========================================

[build]
  command = "npm --prefix client install && npm --prefix client run build && node -e \"const fs=require('fs'); fs.cpSync('client/dist', 'dist', {recursive:true});\""
  publish = "dist"

# Handle Single Page Application (SPA) client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
